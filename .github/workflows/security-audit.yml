name: Extreme Security Fuzzing & Integrity Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-fuzz-audit:
    name: 1,000,000+ Vector Security Fuzzer & Zero-Trust Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 1,000,000+ Vector Security Test Suite
        run: |
          python tests/security_fuzzer.py
